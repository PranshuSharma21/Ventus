<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get in Touch - Ventus AI Interviewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #080b12; color: #ffffff; overflow-x: hidden; line-height: 1.6; }

    .navbar-wrapper { position: fixed; top: 1.8rem; left: 0; width: 100%; display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .navbar { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 0.4rem; border-radius: 50px; }
    .navbar ul { display: flex; list-style: none; gap: 0.3rem; align-items: center; }
    .navbar ul li a { color: #ffffff; text-decoration: none; font-size: 1.05rem; font-weight: 500; padding: 0.7rem 1.4rem; border-radius: 40px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
    .navbar ul li a:hover, .navbar ul li a.active { background-color: #ffffff; color: #000000; }

    .contact-container { padding: 9rem 2rem 4rem; max-width: 800px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; gap: 2.5rem; justify-content: center; }
    .contact-header { text-align: center; }
    .contact-header h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 0.5rem; }
    .contact-header p { color: #94a3b8; font-size: 1.1rem; }

    .contact-form-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 3rem; width: 100%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
    .form-group { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.8rem; }
    .form-group label { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
    .form-group input, .form-group textarea, .form-group select { background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.15); padding: 1rem 1.4rem; border-radius: 14px; color: #ffffff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #38bdf8; }
    .form-group textarea { resize: vertical; min-height: 150px; }

    .submit-btn { background: #38bdf8; color: #080b12; border: none; padding: 1rem 2rem; border-radius: 14px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: background 0.2s; width: 100%; margin-top: 0.5rem; }
    .submit-btn:hover { background: #0284c7; color: #ffffff; }

    .status-msg { margin-top: 1.2rem; font-size: 0.95rem; text-align: center; border-radius: 10px; padding: 0.8rem; display: none; }
    .status-msg.success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-msg.error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    footer { background-color: #030508; padding: 3rem 2rem 2rem; text-align: center; margin-top: auto; }
    .footer-socials { display: flex; justify-content: center; align-items: center; gap: 2rem; margin-bottom: 2rem; }
    .footer-socials a { color: #ffffff; font-size: 1.5rem; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; text-decoration: none; transition: transform 0.3s ease; }
    .footer-socials a:hover { transform: translateY(-3px); }
    .copyright { color: #ffffff; font-size: 0.85rem; border-top: 1px solid #ffffff; padding-top: 1.5rem; max-width: 600px; margin: 0 auto; }
  </style>
</head>
<body>

  <div class="navbar-wrapper">
    <nav class="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="demo.html">Live Demo</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" class="active">Get in Touch</a></li>
        <li><a href="beta.html">Beta Version</a></li>
      </ul>
    </nav>
  </div>

  <div class="contact-container">
    <header class="contact-header">
      <h1>Get in Touch</h1>
      <p>Have questions about Ventus enterprise AI evaluation platform? Reach out to our team.</p>
    </header>

    <div class="contact-form-card">
      <form id="contactForm" onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" name="email" placeholder="john@company.com" required>
        </div>

        <div class="form-group">
          <label for="inquiryType">Inquiry Type</label>
          <select id="inquiryType" name="inquiryType">
            <option value="Enterprise Sales">Enterprise Platform Demo</option>
            <option value="ATS Integration">ATS Integration Request</option>
            <option value="Technical Support">Technical Support</option>
            <option value="General Inquiry">General Inquiry</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Describe your team's requirements or questions..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
        <div id="statusMsg" class="status-msg"></div>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-socials">
      <a href="https://www.youtube.com/@Ventus-ai" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
      <a href="https://www.instagram.com/ventus_ai_inc/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com/Ventus_Ai_inc" target="_blank" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
      <a href="https://linktr.ee/Ventus.Ai" target="_blank" aria-label="Linktree"><i class="fas fa-link"></i></a>
    </div>
    <p class="copyright">&copy; All Rights Reserved. Ventus AI Inc.</p>
  </footer>

  <script>
    const FORMSPREE_FORM_ID = "mnpajwle";

    async function handleContactSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";
      statusMsg.style.display = "none";

      const formData = new FormData(form);

      try {
        const response = await fetch(`https://formspree.io/f/${FORMSPREE_FORM_ID}`, {
          method: "POST",
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          statusMsg.className = "status-msg success";
          statusMsg.innerText = "Thank you! Your message has been sent successfully.";
          statusMsg.style.display = "block";
          form.reset();
        } else {
          throw new Error("Form submission failed");
        }
      } catch (err) {
        statusMsg.className = "status-msg error";
        statusMsg.innerText = "Error sending message. Please try again later.";
        statusMsg.style.display = "block";
      }

      submitBtn.disabled = false;
      submitBtn.innerText = "Send Message";
    }
  </script>

</body>
</html>
